<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Maaşa Kaç Gün?</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:500px;margin:auto;padding:22px 15px 70px}
header{font-size:22px;font-weight:900;margin-bottom:18px}
.card{background:#101d30;border:1px solid #253a58;border-radius:22px;padding:17px;margin:12px 0}
.hero{text-align:center;padding:28px 15px}
.small{font-size:11px;color:#8fa2bb}
.amount{font-size:45px;font-weight:900;color:#56e39f;margin:10px}
.days{color:#a9dcff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:11px;color:#bac8d9;margin:8px 0 5px}
input,select{width:100%;background:#091626;color:white;border:1px solid #304765;padding:12px;border-radius:12px;font-size:15px}
button{width:100%;border:0;border-radius:13px;padding:13px;margin-top:12px;background:#56e39f;color:#062234;font-weight:900}
.item{padding:10px 0;border-top:1px solid #253a58;display:flex;justify-content:space-between;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#172740;border-radius:15px;padding:13px}
.stat small{color:#8fa2bb}.stat b{display:block;margin-top:5px}
</style>
</head>
<body>
<div class="app">

<header>₺ Maaşa Kaç Gün?</header>

<div class="card hero">
<div class="small">BUGÜN GÜVENLE HARCAYABİLECEĞİN</div>
<div class="amount" id="daily">— TL</div>
<div class="days" id="days">Planını oluştur</div>
</div>

<div class="stats">
<div class="stat"><small>KALAN PARA</small><b id="remaining">—</b></div>
<div class="stat"><small>TOPLAM HARCAMA</small><b id="spent">0 TL</b></div>
</div>

<div class="card">
<h3>Planım</h3>
<div class="grid">
<div><label>Toplam gelir</label><input id="income" type="number"></div>
<div><label>Sabit giderler</label><input id="fixed" type="number"></div>
<div><label>Birikim hedefi</label><input id="saving" type="number"></div>
<div><label>Sonraki maaş günü</label><input id="payday" type="date"></div>
</div>
<button onclick="savePlan()">Planı Kaydet</button>
</div>

<div class="card">
<h3>Harcama Ekle</h3>
<div class="grid">
<div><label>Tutar</label><input id="expense" type="number"></div>
<div>
<label>Kategori</label>
<select id="category">
<option>Market</option>
<option>Yemek</option>
<option>Ulaşım</option>
<option>Fatura</option>
<option>Alışveriş</option>
<option>Eğlence</option>
<option>Sağlık</option>
<option>Diğer</option>
</select>
</div>
</div>
<label>Not</label>
<input id="note">
<button onclick="addExpense()">Harcamayı Kaydet</button>
<div id="history"></div>
</div>

</div>

<script>
const KEY="maasa-kac-gun";

let data=JSON.parse(localStorage.getItem(KEY)||'{"income":0,"fixed":0,"saving":0,"payday":"","expenses":[]}');

function money(n){
return new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(Math.max(0,n))+" TL";
}

function daysLeft(){
if(!data.payday)return 0;
let now=new Date();
now.setHours(0,0,0,0);
let pay=new Date(data.payday+"T00:00:00");
return Math.max(1,Math.ceil((pay-now)/86400000));
}

function render(){
income.value=data.income||"";
fixed.value=data.fixed||"";
saving.value=data.saving||"";
payday.value=data.payday||"";

let totalSpent=data.expenses.reduce((a,e)=>a+e.amount,0);
let remainingMoney=data.income-data.fixed-data.saving-totalSpent;
let d=daysLeft();

daily.textContent=d?money(remainingMoney/d):"— TL";
days.textContent=d?"Maaşa "+d+" gün kaldı":"Planını oluştur";
remaining.textContent=d?money(remainingMoney):"—";
spent.textContent=money(totalSpent);

history.innerHTML=data.expenses.length
?data.expenses.slice().reverse().map(e =>
'<div class="item"><span>'+e.category+(e.note?" • "+e.note:"")+'</span><b>'+money(e.amount)+'</b></div>'
).join("")
:'<p class="small">Henüz harcama eklenmedi.</p>';

localStorage.setItem(KEY,JSON.stringify(data));
}

function savePlan(){
data.income=Number(income.value)||0;
data.fixed=Number(fixed.value)||0;
data.saving=Number(saving.value)||0;
data.payday=payday.value;
render();
}

function addExpense(){
let amount=Number(expense.value)||0;
if(amount<=0)return alert("Harcama tutarını gir.");

data.expenses.push({
amount:amount,
category:category.value,
note:note.value.trim()
});

expense.value="";
note.value="";
render();
}

render();
</script>
</body>
</html>
